<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>루팡 랭킹 기준 - 월루미터</title>
    <meta
      name="description"
      content="월루미터의 금액별, 시간별 랭킹 기준과 매일 자정 초기화 방식을 설명합니다."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        background: #f7f2ea;
        color: #24221f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      main {
        box-sizing: border-box;
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }

      a {
        color: #8b5e3c;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p,
      li {
        color: #5e564e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">월루미터로 돌아가기</a></p>
      <h1>루팡 랭킹 기준</h1>
      <p>
        월루미터는 오늘 하루 동안 기록된 루팡 시간을 기준으로 실시간 Top 5
        랭킹을 보여줍니다.
      </p>
      <ul>
        <li>시간 랭킹은 누적 루팡 시간이 긴 순서로 정렬합니다.</li>
        <li>금액 랭킹은 현재 입력한 월급 조건으로 환산한 금액 기준으로 표시합니다.</li>
        <li>랭킹은 매일 자정 이후 새 날짜 기준으로 전환됩니다.</li>
        <li>하루 최대 루팡 가능 시간은 14시간입니다.</li>
        <li>월급, 근무일, 근무시간은 Firestore에 저장하지 않습니다.</li>
      </ul>
    </main>
  </body>
</html>
