<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>월급별 루팡 금액 예시 - 월루미터</title>
    <meta
      name="description"
      content="월급 250만 원, 300만 원, 500만 원 기준으로 쉬는 시간 동안 누적되는 월급 루팡 금액 예시를 확인해보세요."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        background: #f7f2ea;
        color: #24221f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      main {
        box-sizing: border-box;
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }

      a {
        color: #8b5e3c;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.2;
      }

      p,
      td,
      th {
        color: #5e564e;
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border: 1px solid #ded5c8;
        border-radius: 8px;
        background: #fff;
      }

      th,
      td {
        border-bottom: 1px solid #eadfce;
        padding: 14px;
        text-align: left;
      }

      th {
        color: #24221f;
        background: #f2ebe1;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">월루미터로 돌아가기</a></p>
      <h1>월급별 루팡 금액 예시</h1>
      <p>
        아래 예시는 월 21일, 하루 8시간 근무 기준입니다. 실제 급여 정산이 아닌
        재미용 환산 결과입니다.
      </p>

      <table>
        <thead>
          <tr>
            <th>월급</th>
            <th>5분</th>
            <th>10분</th>
            <th>30분</th>
            <th>1시간</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>250만 원</td>
            <td>약 1,240원</td>
            <td>약 2,480원</td>
            <td>약 7,440원</td>
            <td>약 14,881원</td>
          </tr>
          <tr>
            <td>300만 원</td>
            <td>약 1,488원</td>
            <td>약 2,976원</td>
            <td>약 8,929원</td>
            <td>약 17,857원</td>
          </tr>
          <tr>
            <td>500만 원</td>
            <td>약 2,480원</td>
            <td>약 4,960원</td>
            <td>약 14,881원</td>
            <td>약 29,762원</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
